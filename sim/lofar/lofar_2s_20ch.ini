[General]
app=oskar_sim_interferometer

[simulator]
double_precision=false
use_gpus=true
cuda_device_ids=all
max_sources_per_chunk=16384

[sky]
oskar_sky_model/file=sky.osm

[telescope]
input_directory=telescope.tm
pol_mode=Full
station_type=Aperture array
aperture_array/array_pattern/enable=true
aperture_array/array_pattern/normalise=true
aperture_array/element_pattern/functional_type=Dipole
aperture_array/element_pattern/dipole_length=0.5
aperture_array/element_pattern/dipole_length_units=Wavelengths

[observation]
num_channels=20
start_frequency_hz=150000000.0
frequency_inc_hz=9765.6250
phase_centre_ra_deg=123.4
phase_centre_dec_deg=52.9
num_time_steps=14400
start_time_utc=01-01-2026 18:00:00.000
length=28800.0

[interferometer]
oskar_vis_filename=lofar_2s_20ch.vis
ms_filename=lofar_2s_20ch.ms
channel_bandwidth_hz=9765.6250
time_average_sec=2
max_time_samples_per_block=8
